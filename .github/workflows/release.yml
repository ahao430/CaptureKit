name: Release

# Tag 驱动发布（ADR-028）：推 v* 标签 → Universal 构建 → DMG + Sparkle zip + appcast → GitHub Release
# 依赖仓库 Secret：SPARKLE_PRIVATE_KEY（EdDSA 私钥文件内容，见 docs/releasing.md）
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version from tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" != v* ]]; then echo "标签必须以 v 开头"; exit 1; fi
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Build release artifacts (universal DMG + update zip)
        run: |
          brew install xcodegen
          scripts/build-release.sh "$VERSION" "${{ github.run_number }}"

      - name: Generate Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          mkdir -p appcast-staging
          cp build/release/CaptureKit.zip appcast-staging/
          scripts/make-appcast.sh appcast-staging \
            "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}"
          cp appcast-staging/appcast.xml build/release/appcast.xml

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            build/release/CaptureKit.dmg
            build/release/CaptureKit.zip
            build/release/appcast.xml
