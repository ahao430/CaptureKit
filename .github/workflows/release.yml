name: Release

# Tag 驱动发布（ADR-028）：推 v* 标签 → Universal 构建 → DMG + Sparkle zip + appcast → GitHub Release
# 依赖仓库 Secret：
#   SPARKLE_PRIVATE_KEY   — Sparkle EdDSA 私钥（appcast 签名）
#   MACOS_SIGNING_P12_B64 — 自签名代码签名证书 p12（base64）；TCC 授权跨版本保留（ADR-030）
#   MACOS_SIGNING_P12_PASSWORD — p12 密码
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version from tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" != v* ]]; then echo "标签必须以 v 开头"; exit 1; fi
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Import code signing certificate
        env:
          MACOS_SIGNING_P12_B64: ${{ secrets.MACOS_SIGNING_P12_B64 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: |
          # 临时钥匙串：不污染 runner 默认链，结束自动丢弃
          KEYCHAIN="build.keychain-db"
          KEYCHAIN_PASS="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -t 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          echo "$MACOS_SIGNING_P12_B64" | base64 --decode > signing.p12
          security import signing.p12 -k "$KEYCHAIN" -P "$MACOS_SIGNING_P12_PASSWORD" -T /usr/bin/codesign
          # 自签名证书在全新 runner 上不被信任（find-identity -v 为 0）→ 用户域信任（无需 sudo）
          openssl pkcs12 -in signing.p12 -nokeys -clcerts -passin "pass:$MACOS_SIGNING_P12_PASSWORD" -out signing-cert.pem
          security add-trusted-cert -r trustRoot -k "$KEYCHAIN" signing-cert.pem
          # 硬校验：身份无效则失败，禁止静默回退 ad-hoc
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "CaptureKit Developer" || {
            echo "错误：签名身份导入/信任失败"; exit 1;
          }
          security set-key-partition-list -S apple-tool:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr '\n' ' ')
          rm signing.p12 signing-cert.pem

      - name: Build release artifacts (universal DMG + update zip)
        env:
          MACOS_SIGNING_IDENTITY: CaptureKit Developer
        run: |
          brew install xcodegen
          scripts/build-release.sh "$VERSION" "${{ github.run_number }}"

      - name: Generate Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          mkdir -p appcast-staging
          cp build/release/CaptureKit.zip appcast-staging/
          scripts/make-appcast.sh appcast-staging \
            "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}"
          cp appcast-staging/appcast.xml build/release/appcast.xml

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            build/release/CaptureKit.dmg
            build/release/CaptureKit.zip
            build/release/appcast.xml
