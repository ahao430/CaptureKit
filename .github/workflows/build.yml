name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: Build & Test (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project CaptureKit.xcodeproj -scheme CaptureKit \
            -destination 'platform=macOS' -derivedDataPath .build-ci \
            build 2>&1 | tail -5

      - name: Test
        run: |
          set -o pipefail
          xcodebuild -project CaptureKit.xcodeproj -scheme CaptureKit \
            -destination 'platform=macOS' -derivedDataPath .build-ci \
            test 2>&1 | tail -30
