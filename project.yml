name: CaptureKit

options:
  bundleIdPrefix: com.wanghao
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: ""
    DEVELOPMENT_TEAM: ""

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1

targets:
  CaptureKit:
    type: application
    platform: macOS
    sources:
      - path: CaptureKit
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wanghao.capturekit
        INFOPLIST_FILE: CaptureKit/Resources/Info.plist
        PRODUCT_NAME: CaptureKit
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO

schemes:
  CaptureKit:
    build:
      targets:
        CaptureKit: all
    run:
      config: Debug
